[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sepa-check"
version = "0.2.1"
description = "CLI for the free SEPA pain.001 and camt.053/054 APIs at checksepa.com"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bobook Limited", email = "info@bobook.club" }]
keywords = ["sepa", "pain.001", "camt.053", "camt.054", "iso20022", "validator", "iban", "xml", "credit-transfer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://checksepa.com"
Documentation = "https://checksepa.com/docs"
Repository = "https://github.com/wenboteng/sepa-validator"
"API waitlist" = "https://checksepa.com/api-waitlist"
Changelog = "https://checksepa.com/changelog"

[project.scripts]
sepa-check = "sepa_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
